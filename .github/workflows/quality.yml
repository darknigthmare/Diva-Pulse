name: Pull request quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify all logical contracts
        run: |
          mkdir -p qa/v30
          python3 tools/verify_release.py | tee qa/v30/release-check.txt
          git diff --exit-code -- index.html DIVA_PULSE_JOUER.html
          npm test | tee qa/v30/logic.tap
          python3 tests/launcher_test.py | tee qa/v30/launcher.txt
      - name: Install pinned browser tooling
        run: |
          python3 -m pip install -r requirements-test.txt
          python3 -m playwright install --with-deps chromium
          python3 - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('CHROMIUM_PATH='+p.chromium.executable_path)
          PY
      - name: Run current and regression browser workflows
        run: |
          rm -f qa/v30/workflow/results.json qa/v30/regression-director/results.json qa/v30/regression-persistence/results.json
          xvfb-run -a python3 tests/v30_browser_test.py | tee qa/v30/browser-run.log
          xvfb-run -a python3 tests/v29_browser_test.py | tee qa/v30/regression-browser.log
          xvfb-run -a python3 tests/v29_persistence_test.py | tee qa/v30/persistence-run.log
          python3 tools/verify_pr30.py
      - name: Preserve commit-linked evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diva-pulse-v30-${{ github.run_id }}
          path: qa/v30/
          retention-days: 30
