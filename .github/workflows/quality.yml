name: Pull request quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source build and logical contracts
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p qa/v34 qa/v35 qa/v36 qa/v37
          printf 'Review head: %s\nChecked-out commit: %s\n' "$REVIEW_HEAD" "$(git rev-parse HEAD)" > qa/v37/commit.txt
          python3 tools/verify_release.py | tee qa/v37/release-check.txt
          git diff --exit-code -- index.html DIVA_PULSE_JOUER.html
          npm test | tee qa/v37/logic.tap
          python3 tests/launcher_test.py | tee qa/v37/launcher.txt
      - name: Install pinned driver and identify the runner browser
        timeout-minutes: 4
        run: |
          python3 -m pip install --disable-pip-version-check --timeout 30 --retries 2 -r requirements-test.txt
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER"
          printf 'CHROMIUM_PATH=%s\n' "$BROWSER" >> "$GITHUB_ENV"
          "$BROWSER" --version | tee qa/v37/browser-version.txt
          python3 -m pip show playwright > qa/v37/driver-version.txt
      - name: Run fresh recovery, records and previous browser scenarios
        run: |
          rm -f qa/v34/{vault-live,feedback,loops,audition,regression-workflow,regression-director,regression-persistence,transactions}/results.json qa/v35/playback/results.json qa/v36/archive/results.json qa/v36/motion/results.json qa/v37/recovery/results.json qa/v37/records-replays/results.json qa/v37/verified.json
          xvfb-run -a python3 tests/v37_recovery_browser.py | tee qa/v37/recovery-run.log
          xvfb-run -a python3 tests/v37_record_replay_browser.py | tee qa/v37/records-replays-run.log
          xvfb-run -a python3 tests/v36_archive_browser.py | tee qa/v36/archive-run.log
          xvfb-run -a python3 tests/v36_motion_browser.py | tee qa/v36/motion-run.log
          xvfb-run -a python3 tests/v35_playback_browser.py | tee qa/v35/playback-run.log
          xvfb-run -a python3 tests/v34_browser_test.py | tee qa/v34/vault-live-run.log
          xvfb-run -a python3 tests/v33_browser_test.py | tee qa/v34/feedback-run.log
          xvfb-run -a python3 tests/v32_browser_test.py | tee qa/v34/loops-run.log
          xvfb-run -a python3 tests/v31_browser_test.py | tee qa/v34/audition-run.log
          xvfb-run -a python3 tests/v30_browser_test.py | tee qa/v34/workflow-run.log
          xvfb-run -a python3 tests/v29_browser_test.py | tee qa/v34/director-run.log
          xvfb-run -a python3 tests/v29_persistence_test.py | tee qa/v34/persistence-run.log
          xvfb-run -a python3 tests/v32_transactions_test.py | tee qa/v34/transactions-run.log
      - name: Check current evidence and exact Excel against the backlog
        run: python3 tools/verify_pr37.py
      - name: Preserve commit-linked evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diva-pulse-v37-${{ github.run_id }}
          path: |
            qa/v34/
            qa/v35/
            qa/v36/
            qa/v37/
            planning/DIVA_PULSE_MANQUANTS_V37.xlsx
          retention-days: 30
