name: Integrate tested V33 feedback into PR 1
on:
  push:
    branches: ['feat/v30-director-workflow']
    paths: ['.github/workflows/integrate-feedback33.yml', 'tools/verify_pr33.py', 'tools/reconcile_motion33.py']
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: diva-pr1-v33-integration
  cancel-in-progress: true
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/v30-director-workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed source changes and receive exact workbook
        run: |
          test "$GITHUB_REF" = 'refs/heads/feat/v30-director-workflow'
          git merge-base --is-ancestor 55b620f77a4084b2304987aec1c037db37fe1607 HEAD
          command -v zstd
          python3 tools/apply_feedback33.py
          python3 tools/reconcile_motion33.py
          python3 tools/receive_workbook33.py
          python3 tools/verify_pr33.py --tracker-only
          mkdir -p qa/v33
          python3 build.py
          python3 tools/verify_release.py | tee qa/v33/release-check.txt
          npm test | tee qa/v33/logic.tap
          python3 tests/launcher_test.py | tee qa/v33/launcher.txt
      - name: Install pinned driver and use runner-provided Chrome
        timeout-minutes: 4
        run: |
          python3 -m pip install --disable-pip-version-check --timeout 30 --retries 2 -r requirements-test.txt
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER"
          printf 'CHROMIUM_PATH=%s\n' "$BROWSER" >> "$GITHUB_ENV"
          "$BROWSER" --version | tee qa/v33/browser-version.txt
          python3 -m pip show playwright > qa/v33/driver-version.txt
      - name: Run fresh native feedback and regression tests
        run: |
          rm -f qa/v33/{feedback,loops,audition,regression-workflow,regression-director,regression-persistence,transactions}/results.json qa/v33/verified.json
          xvfb-run -a python3 tests/v33_browser_test.py | tee qa/v33/feedback-run.log
          xvfb-run -a python3 tests/v32_browser_test.py | tee qa/v33/loops-run.log
          xvfb-run -a python3 tests/v31_browser_test.py | tee qa/v33/audition-run.log
          xvfb-run -a python3 tests/v30_browser_test.py | tee qa/v33/workflow-run.log
          xvfb-run -a python3 tests/v29_browser_test.py | tee qa/v33/director-run.log
          xvfb-run -a python3 tests/v29_persistence_test.py | tee qa/v33/persistence-run.log
          xvfb-run -a python3 tests/v32_transactions_test.py | tee qa/v33/transactions-run.log
          python3 tools/verify_pr33.py
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diva-pulse-v33-integration-${{ github.run_id }}
          path: |
            qa/v33/
            planning/DIVA_PULSE_MANQUANTS_V33.xlsx
          retention-days: 30
      - name: Publish tested generated changes only to PR branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/feat/v30-director-workflow'
          git diff --exit-code -- .github
          test "$(git ls-remote origin refs/heads/feat/v30-director-workflow | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'Diva Pulse maintenance'
          git config user.email '7942594+darknigthmare@users.noreply.github.com'
          git add src/app.js src/core.js src/template.html src/enhancements.js src/feedback33.js build.py VERSION.txt package.json sw.js manifest.webmanifest index.html DIVA_PULSE_JOUER.html tools/verify_pr33.py tests/v33_browser_test.py
          git add tests/v29_browser_test.py tests/v29_persistence_test.py tests/v30_browser_test.py tests/v31_browser_test.py tests/v32_browser_test.py tests/v32_transactions_test.py
          git add planning/DIVA_PULSE_MANQUANTS_V33.xlsx planning/BACKLOG_V33.json planning/MANQUANTS_V33.csv qa/v33
          git commit -m 'feat: V33 gameplay fixes, bounded VFX SFX and reviewed 132-item Excel'
          git push origin HEAD:feat/v30-director-workflow
