name: Integrate verified V34 into PR 1
on:
  push:
    branches: ['feat/v30-director-workflow']
    paths: ['.github/workflows/integrate34.yml', 'tools/delivery34/**']
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: diva-v34-integration
  cancel-in-progress: true
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/v30-director-workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact reviewed sources and reconstruct the inspected workbook
        run: |
          python3 tools/delivery34/apply.py
          python3 build.py
          echo '1c6efbe5d93ef8ecdb09eef0d1f00eadd0c1bf5a2b425030679ab6ef608c0d35  index.html' | sha256sum --check
          python3 tools/verify_release.py | tee qa/v34/release-check.txt
          git rev-parse HEAD > qa/v34/integration-parent.txt
          npm test | tee qa/v34/logic.tap
          python3 tests/launcher_test.py | tee qa/v34/launcher.txt
      - name: Install pinned driver and identify the runner browser
        timeout-minutes: 4
        run: |
          python3 -m pip install --disable-pip-version-check --timeout 30 --retries 2 -r requirements-test.txt
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER"
          printf 'CHROMIUM_PATH=%s\n' "$BROWSER" >> "$GITHUB_ENV"
          "$BROWSER" --version | tee qa/v34/browser-version.txt
          python3 -m pip show playwright > qa/v34/driver-version.txt
      - name: Execute fresh native storage, audio and gameplay scenarios
        run: |
          rm -f qa/v34/{vault-live,feedback,loops,audition,regression-workflow,regression-director,regression-persistence,transactions}/results.json qa/v34/verified.json
          xvfb-run -a python3 tests/v34_browser_test.py | tee qa/v34/vault-live-run.log
          xvfb-run -a python3 tests/v33_browser_test.py | tee qa/v34/feedback-run.log
          xvfb-run -a python3 tests/v32_browser_test.py | tee qa/v34/loops-run.log
          xvfb-run -a python3 tests/v31_browser_test.py | tee qa/v34/audition-run.log
          xvfb-run -a python3 tests/v30_browser_test.py | tee qa/v34/workflow-run.log
          xvfb-run -a python3 tests/v29_browser_test.py | tee qa/v34/director-run.log
          xvfb-run -a python3 tests/v29_persistence_test.py | tee qa/v34/persistence-run.log
          xvfb-run -a python3 tests/v32_transactions_test.py | tee qa/v34/transactions-run.log
          python3 tools/verify_pr34.py
      - name: Preserve evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diva-pulse-v34-integration-${{ github.run_id }}
          path: |
            qa/v34/
            planning/DIVA_PULSE_MANQUANTS_V34.xlsx
          retention-days: 30
      - name: Publish verified implementation only to the requested PR branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/feat/v30-director-workflow'
          git fetch origin feat/v30-director-workflow
          test "$(git rev-parse origin/feat/v30-director-workflow)" = "$GITHUB_SHA"
          git diff --exit-code -- .github tools/delivery34
          git config user.name 'Diva Pulse maintenance'
          git config user.email '7942594+darknigthmare@users.noreply.github.com'
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          paths=json.loads(Path('qa/v34/delivery-paths.json').read_text())
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git commit -m 'feat: V34 safe media cleanup, interruption handling, HOLD gauges and 136-item Excel'
          git push origin HEAD:feat/v30-director-workflow
