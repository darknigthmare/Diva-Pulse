name: Finalize reviewed V30 mobile controls
on:
  push:
    branches: ['feat/v30-director-workflow']
    paths: ['.github/workflows/import-pr30.yml']
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  finish:
    if: github.ref == 'refs/heads/feat/v30-director-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed readability fix and stronger existing check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='95733be0e43e24e98378daef408e021ddac71bd0'
          p=Path('src/director.css')
          addition='/* V30: retain readable labels and touch targets instead of squeezing six columns. */\n#modal.director-modal .director-batch .buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}\n@media(max-width:600px){\n #modal.director-modal .buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}\n #modal.director-modal .director-batch .buttons{grid-template-columns:repeat(2,minmax(0,1fr))}\n #modal.director-modal .buttons button{min-height:48px;word-break:normal;overflow-wrap:normal;hyphens:none}\n}\n'
          assert addition not in p.read_text();p.write_text(p.read_text()+addition)
          p=Path('tests/v30_browser_test.py');s=p.read_text()
          old='document.getElementById("modalContent").scrollWidth<=document.getElementById("modalContent").clientWidth+1'
          new=old+'&&[...document.querySelectorAll(".director-batch .buttons button")].every(b=>b.getBoundingClientRect().width>=120&&b.getBoundingClientRect().height>=48)'
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          for name in ['workflow','regression-director']:
              p=Path('qa/v30')/name/'results.json'
              dest=Path('qa/v30/local-before-mobile')/name/'results.json'
              dest.parent.mkdir(parents=True,exist_ok=True);p.rename(dest)
          Path('qa/v30/README.md').write_text('V30 verification\n================\n\nThe reports in local-before-mobile are historical injected-document checks before the final CSS readability fix. They are not native persistence evidence. Current commit-linked native evidence is produced by Pull request quality and attached as an Actions artifact. Its verified.json must match the current index.html SHA-256. No physical iPhone, hardware timing or universal MMD certification is claimed.\n')
          PY
          python3 build.py
          python3 tools/verify_release.py > qa/v30/release-check.txt
          echo '797cf9923ddf47b6e8a9c08ffd895951fae4d9e7ec0f16c9f43ddcecee2ac36b  index.html' | sha256sum --check
          npm test > qa/v30/logic.tap
          grep '^# pass 862$' qa/v30/logic.tap
          grep '^# fail 0$' qa/v30/logic.tap
      - name: Publish source-only changes to PR branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/feat/v30-director-workflow'
          git diff --exit-code -- .github
          git config user.name 'Diva Pulse maintenance'
          git config user.email '7942594+darknigthmare@users.noreply.github.com'
          git add --all
          git commit -m 'fix: readable Director touch controls and current-build QA separation'
          git push origin HEAD:feat/v30-director-workflow
