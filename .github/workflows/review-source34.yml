name: Current PR source snapshot
on:
  push:
    branches: ['feat/v30-director-workflow']
    paths: ['.github/workflows/review-source34.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked sources at the checked-out revision
        run: |
          git rev-parse HEAD > SOURCE_REVISION.txt
          git archive --format=zip --output=review-source34.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: diva-current-source-v34
          path: |
            review-source34.zip
            SOURCE_REVISION.txt
          retention-days: 7
